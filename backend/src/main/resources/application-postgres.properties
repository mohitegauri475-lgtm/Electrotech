# ==============================================================================
# Render Managed PostgreSQL Configuration
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
# DatabaseConfig.java automatically detects and parses Render's DATABASE_URL environment variable.
# The fallback below supports standard JDBC environment variables:
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/giftedit_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==============================================================================
# JPA / Hibernate Configuration for PostgreSQL
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Database Migration
# Disabled in postgres profile in favor of Hibernate ddl-auto schema management
# ==============================================================================
spring.flyway.enabled=false
