# Dynamic Server Port for Cloud (Render) with Local Fallback
server.port=${PORT:8080}

# Spring Application & Configurable Active Profile
spring.application.name=giftedit-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================================
# Microsoft SQL Server (MSSQL) Configuration
# ==============================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=giftedit_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=GiftEdit@123456

# For Windows Integrated Security, uncomment below and comment out username/password:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=giftedit_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Database Migration
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
jwt.secret=9a6747f3b64c12d4a51e670d8924b1ac8952a234f9a8b1123456789abcdef012
jwt.expiration-ms=86400000

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO
