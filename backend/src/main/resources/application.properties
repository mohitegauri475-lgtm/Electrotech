# Dynamic Server Port for Cloud (Render) with Local Fallback
server.port=${PORT:8080}

# Spring Application & Configurable Active Profile
spring.application.name=giftedit-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================================
# Datasource Configuration (Defaults for local development; overridden by active profile)
# ==============================================================================
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=giftedit_db;encrypt=true;trustServerCertificate=true}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:GiftEdit@123456}

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Database Migration
# Disabled by default for cloud profiles; enabled in application-local.properties for MSSQL
# ==============================================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
jwt.secret=9a6747f3b64c12d4a51e670d8924b1ac8952a234f9a8b1123456789abcdef012
jwt.expiration-ms=86400000

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO
