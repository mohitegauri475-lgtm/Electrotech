# ==============================================================================
# Local Development: Microsoft SQL Server (MSSQL) Configuration
# ==============================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=giftedit_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=GiftEdit@123456

# JPA / Hibernate Configuration for MSSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway Database Migration (Local MSSQL)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration