# ==============================================================================
# Render Infrastructure Blueprint (render.yaml)
# Full-Stack Deployment: Spring Boot 3 + PostgreSQL + React 18 / Vite
# ==============================================================================

databases:
  - name: electrotech-db
    databaseName: giftedit_db
    user: giftedit_user
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (Spring Boot 3 + Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: electrotech-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: electrotech-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: electrotech-frontend
          property: host

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: electrotech-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: electrotech-backend
          property: host